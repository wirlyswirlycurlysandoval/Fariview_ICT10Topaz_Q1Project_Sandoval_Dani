<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>
          body{
            font-family: Gill Sans;
            background-image: url("https://i.pinimg.com/1200x/42/d6/38/42d63813f7045e54ef786148ae354f45.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
       .container {
           padding: 30px;
            border-radius: 15px;
            margin: auto;
            width: 450px;
            box-shadow: 0 4px 10px rgb(233, 231, 231);
            background-color: rgb(235, 235, 235);
       }

       .shop-container {
           padding: 30px;
            border-radius: 15px;
            margin: auto;
            width: 450px;
            box-shadow: 0 4px 10px rgb(233, 231, 231);
            background-color:rgb(239, 184, 193);
       }
    </style>


    <title>Product SKU</title>
</head>


<body>


    <nav class="navbar navbar-expand-lg bg-light">


        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">


                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Reciept Generator
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="sku.html">
                        Product SKU
                    </a>
                </li>


            </ul>
        </div>


    </nav>




    <div class="shop-container">


        <h1 class="text-center">Product SKU</h1>
        <br>
        <form>
            <label for="category">Category</label>


            <select id="category" class="form-control">


                <option value="VS">Vaseline</option>
                <option value="CR">Crunchy</option>
                <option value="NH">Needoh</option>
                <option value="SS">Slushee</option>
            </select>
            <br>

            <label for="product">Product Name</label>


            <input type="text" id="product" class="form-control" placeholder="e.g. Cheese">
            <br>
            <label for="stock">Stock Quantity</label>

            <input type="number" id="stock" class="form-control" placeholder="e.g. 67">

            <br>

            <button type="button" py-click="sku_result" class="btn"> Generate</button>


        </form>


    </div>

    <br>
    <br>


    <div id="output2" class="text-center container">


        Your generated SKU will appear here.

    </div>

    <script type="py" src="main.py"></script>


</body>
</html>
